<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Recuperar Senha</title>
</head>

<body>
    <header>
        <a href="../homepage/index.html">
            <img src="../speed_logo_academycinza.png" alt="Speed Academy" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="../homepage/index.html">Inicio</a></li>
                <li><a href="../Sobre Nós/index.html">Sobre Nós</a></li>
                <li><a href="../Client Area/index.html">Área Do Cliente</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <form>
            <h1>Recuperar Senha</h1>
            <div class="input-container">
                <div class="linha">
                    <label>Nome*</label>
                    <input placeholder="Nome Completo" type="text" maxlength="20">
                </div>

                <div class="linha">
                    <label>E-mail*</label>
                    <input placeholder="seu@email.com" type="email" maxlength="30" required>
                </div>

                <div class="linha">
                    <label>Telefone*</label>
                    <input placeholder="(11)99999-9999" type="tell" maxlength="16" required>
                </div>

                <label>Selecione Seu Estado*</label>
                <select>
                    <option>Selecione</option>
                    <option>Acre (AC)</option>
                    <option>Amapa (AP)</option>
                    <option>Amazonas (AM)</option>
                    <option>Pará (PA)</option>
                    <option>Rondônia (RO)</option>
                    <option>Roraima (RR)</option>
                    <option>Tocantins (TO)</option>
                    <option>Alagoas (AL)</option>
                    <option>Bahia (BA)</option>
                    <option>Ceará (CE)</option>
                    <option>Maranhão (MA)</option>
                    <option>Paraíba (PB)</option>
                    <option>Pernambuco (PE)</option>
                    <option>Piauí (PI)</option>
                    <option>Rio Grande Do Norte (RN)</option>
                    <option>Sergipe (SE)</option>
                    <option>Goias (GO)</option>
                    <option>Mato Grosso (MT)</option>
                    <option>Mato Grosso Do Sul (MS)</option>
                    <option>Distrito Federal (DF)</option>
                    <option>Espírito Santo (ES)</option>
                    <option>Minas Gerais (MG)</option>
                    <option>Rio De Janeiro (RJ)</option>
                    <option>São Paulo (SP)</option>
                    <option>Paraná (PR)</option>
                    <option>Rio Grande Do Sul (RS)</option>
                    <option>Santa Catarina (SC)</option>
                </select>
                <div>
                    <button class="botao-recuperar"> <a href="#">Recuperar</a></button>
                </div>
                <p>Não Lembro Meu E-mail:</p>
                <a href="../Alternative Options/index.html" class="outras-opcoes">Outras Opções</a>
            </div>
        </form>
        <label></label>
    </div>
</body>

</html>
