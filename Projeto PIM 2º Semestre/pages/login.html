<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Login</title>
</head>

<body>
    <header>
        <a href="../pages/homepage.html">
            <img src="../assets/image/speed_logo_academycinza.png" alt="Speed Academy" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="../pages/homepage.html">Inicio</a></li>
                <li><a href="../pages/homepage.html">Sobre Nós</a></li>
                <li><a href="../pages/index.html">Área Do Cliente</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <form id="formLogin">
            <h1>Login</h1>
            <div class="input-container">
                <p class="tag-p">E-mail*</p>
                <input placeholder="seu@email.com" type="text" maxlength ="30" autocomplete="off" id="email">
                <small id="erroEmail"></small>

                <p class="tag-p">Senha*</p>
                <input placeholder="Senha" type="password" maxlength="30" autocomplete="off" id="senha"><br>
                <small id="erroSenha"></small>

                <a href="../pages/recover.html" class="recuperar-senha">Esqueceu sua senha?</a>
                <p id="mensagem"></p>
                <p>Não possui uma conta? <a href="../pages/register.html" class="cadastrar-conta">Cadastre-se </a></p>
                <br>    

                <button class="botao-entrar" type="submit">ENTRAR</a>
                </button>

        </form>

    </div>
    <script src="login.js"></script>
</body>

</html>
