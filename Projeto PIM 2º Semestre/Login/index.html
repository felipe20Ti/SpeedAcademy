<head>

    <title>Login</title>
</head>

<body>
    <header>
        <a href="../homepage/index.html">
            <img src="../speed_logo_academycinza.png" alt="Speed Academy" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="../homepage/index.html">Inicio</a></li>

    <div class="container">
        <form id="formLogin">
            <h1>Login</h1>
            <div class="input-container">
                <p class="tag-p">E-mail*</p>
                <input placeholder="seu@email.com" type="text"  maxlenght="30" autocomplete="off" id="email">
                <small id="erroEmail"></small>

                <p class="tag-p">Senha*</p>
                <input placeholder="Senha" type="password"  maxlenght="30" autocomplete="off" id="senha"><br>
                <small id="erroSenha"></small>

                <a href="../Recover Password/index.html" class="recuperar-senha">Esqueceu sua senha?</a>
                <p>Não possui uma conta? <a href="../Register/index.html" class="cadastrar-conta">Cadastre-se </a></p>
                <br>
                
                <button class="botao-entrar" type="submit"> <a href="../Login/index.html">ENTRAR</a>
                </button>
            </div>
    </div>
    </form>
    <script src="login.js"></script>
</body>
