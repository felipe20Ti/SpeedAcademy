<body>
    <header>

        <nav>

        <form>
            <h1>Recuperar Senha</h1>
            <div class="input-container">
                <div class="linha">
                    <label>E-mail*</label>
                    <input placeholder="seu@email.com" type="text" maxlength="30" required autocomplete="none">
                </div>

                <div class="linha">
                    <label>Nova Senha*</label>
                    <input placeholder="nova senha" type="password" maxlength="30" required autocomplete="off">
                </div>

                <div class="linha">
                    <label>Repita a Nova Senha*</label>
                    <input placeholder="nova senha" type="password" maxlength="30" required autocomplete="off">
                </div>

                <div>
                    <button class="botao-recuperar"> <a href="../Login/index.html">Recuperar</a></button>
        </form>
    </div>
